<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Portfolio{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="/">Conner Brunner</a>
            </div>
            <ul class="nav-links">
                <li><a href="/" class="{% if request.endpoint == 'home' %}active{% endif %}">Home</a></li>
                <li><a href="/gaming" class="{% if request.endpoint == 'category' and category == 'games' %}active{% endif %}">Gaming</a></li>
                <li><a href="/movies" class="{% if request.endpoint == 'category' and category == 'movies' %}active{% endif %}">Movies</a></li>
                <li><a href="/food" class="{% if request.endpoint == 'category' and category == 'food' %}active{% endif %}">Food</a></li>
                <li><a href="/games" class="{% if request.endpoint == 'games' %}active{% endif %}">100% Games</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 Conner Burner. Built with Flask & Pure Grit</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
</html>
